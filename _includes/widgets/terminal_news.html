{% assign news = site.news | sort: 'date' | reverse %}
<section class="agent-only terminal-native-output terminal-news-output">
    <div class="terminal-log-header"><span>DATE</span><span>UPDATE</span></div>
    <ol class="terminal-log">
        {% for item in news %}
        <li><time datetime="{{ item.date | date: '%Y-%m-%d' }}">{{ item.date | date: '%Y-%m-%d' }}</time><div>{% if site.active_lang == 'zh' and item.title_zh %}{{ item.title_zh }}{% else %}{{ item.title }}{% endif %}</div></li>
        {% endfor %}
    </ol>
</section>
