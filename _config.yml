# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.
title: "Shaofei Cai"
description: >-
  Shaofei Cai (蔡少斐) — Researcher at DeepSeek AI, Ph.D. from Peking University.
  Research on AI agents, reinforcement learning, and large language models.
url: "https://phython96.github.io" # used by absolute_url for canonical + Open Graph URLs
baseurl: "" # the subpath of your site, e.g. /blog

# Build settings
markdown: kramdown
plugins:
  - jekyll-email-protect
  - jekyll-polyglot

# Multilingual settings (jekyll-polyglot)
languages: ["zh", "en"]
default_lang: "zh"
exclude_from_localization: ["assets", "javascript", "images", "CNAME", ".nojekyll"]
parallel_localization: false

# Visitor analytics
analytics:
  vercount: true        # visible PV/UV counter in the footer (Busuanzi-compatible)
  goatcounter: ""       # private dashboard: set to your GoatCounter code, e.g. "phython96"
  flagcounter_src: ""   # visitor geography (Flag Counter image src). Empty = hidden. Saved code: https://s05.flagcounter.com/count/xD0J/bg_FFFFFF/txt_5B5B6B/border_FFFFFF/columns_3/maxflags_15/viewers_3/labels_0/pageviews_0/flags_0/percent_0/

# Exclude from processing. Setting this list overrides Jekyll's defaults, so the
# default entries are repeated here alongside the extra ones.
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - .jekyll-metadata
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  # build-time helpers — not part of the published site
  - tools/

# timezone: Asia/Shanghai

collections:
  - publications
  - news
  - showcase
